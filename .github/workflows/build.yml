name: build-images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Dockerfile.ik-llama.in'
      - 'wrapper.sh'
      - 'go-4/**'
      - 'models/**'
      - '.github/workflows/build.yml'

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: ${{ matrix.image_name }}:${{ matrix.image_tag }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_name: eve
            dockerfile_template: Dockerfile.ik-llama.in
            config_path: models/ornith-1.0-35b/config.yaml
            download_mode: single
            hf_repo: deepreinforce-ai/Ornith-1.0-35B-GGUF
            hf_filename: ornith-1.0-35b-Q4_K_M.gguf
            shard: 'true'
            image_tag: latest
            smoke_health_path: /health
            smoke_models_path: /v1/models
            smoke_heavy_path: /v1/chat/completions
            smoke_heavy_body: '{"model":"eve","messages":[{"role":"user","content":"hi"}],"max_tokens":2}'
            smoke_heavy_timeout: 180
          - image_name: wall-e
            dockerfile_template: Dockerfile.ik-llama.in
            config_path: models/gemma-4-12b-it-qat-q4_0/config.yaml
            download_mode: single
            hf_repo: google/gemma-4-12b-it-qat-q4_0-gguf
            hf_filename: gemma-4-12b-it-qat-q4_0.gguf
            shard: 'true'
            image_tag: latest
            smoke_health_path: /health
            smoke_models_path: /v1/models
            smoke_heavy_path: /v1/chat/completions
            smoke_heavy_body: '{"model":"wall-e","messages":[{"role":"user","content":"hi"}],"max_tokens":2}'
            smoke_heavy_timeout: 120
          - image_name: go-4
            dockerfile_template: go-4/Dockerfile.go-4.in
            download_mode: snapshot
            hf_repos: |
              nomic-ai/nomic-embed-text-v1.5
              nomic-ai/nomic-embed-vision-v1.5
            hf_snapshot_dirs: |
              go-4-snapshot-text
              go-4-snapshot-vision
            shard: 'false'
            image_tag: latest
            smoke_health_path: /health
            smoke_models_path: /v1/models
            smoke_heavy_path: /v1/embeddings
            smoke_heavy_body: '{"model":"nomic-embed-vision-v1.5","input":"smoke test"}'
            smoke_heavy_timeout: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          echo "Before:"
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/lib/android 2>/dev/null || true
          sudo apt-get clean 2>/dev/null || true
          docker image prune --all --force 2>/dev/null || true
          echo "After:"
          df -h /

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install huggingface_hub
        run: pip install --quiet huggingface_hub

      - name: Download model (${{ matrix.download_mode }})
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO: ${{ matrix.hf_repo }}
          HF_FILENAME: ${{ matrix.hf_filename }}
          DOWNLOAD_MODE: ${{ matrix.download_mode }}
          HF_REPOS: ${{ matrix.hf_repos }}
          HF_SNAPSHOT_DIRS: ${{ matrix.hf_snapshot_dirs }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import hf_hub_download, snapshot_download

          mode = os.environ["DOWNLOAD_MODE"]
          token = os.environ.get("HF_TOKEN") or None

          if mode == "single":
              path = hf_hub_download(
                  repo_id=os.environ["HF_REPO"],
                  filename=os.environ["HF_FILENAME"],
                  repo_type="model",
                  local_dir=".",
                  token=token,
              )
              print("Downloaded:", path)
          elif mode == "snapshot":
              repos = [r.strip() for r in os.environ.get("HF_REPOS", "").splitlines() if r.strip()]
              dirs  = [d.strip() for d in os.environ.get("HF_SNAPSHOT_DIRS", "").splitlines() if d.strip()]
              if len(repos) != len(dirs):
                  raise SystemExit(f"HF_REPOS and HF_SNAPSHOT_DIRS length mismatch: {len(repos)} vs {len(dirs)}")
              for repo, dest in zip(repos, dirs):
                  path = snapshot_download(repo_id=repo, local_dir=dest, token=token)
                  print(f"Downloaded {repo} to:", path)
          else:
              raise SystemExit(f"unknown download mode: {mode}")
          PY

      - name: Build llama-gguf-split
        if: matrix.shard == 'true'
        run: |
          git clone --depth 1 https://github.com/ggerganov/llama.cpp.git
          cmake -S llama.cpp -B llama.cpp/build -DCMAKE_BUILD_TYPE=Release
          cmake --build llama.cpp/build --target llama-gguf-split -j"$(nproc)"
          ls -lh llama.cpp/build/bin/llama-gguf-split

      - name: Shard GGUF (~5 GB per shard)
        if: matrix.shard == 'true'
        env:
          HF_FILENAME: ${{ matrix.hf_filename }}
        run: |
          base="${HF_FILENAME%.gguf}"
          ./llama.cpp/build/bin/llama-gguf-split \
            --split-max-size 5G \
            "$HF_FILENAME" \
            "$base"
          rm "$HF_FILENAME"
          echo "--- shards ---"
          ls -lh "$base-"*.gguf

      - name: Cleanup llama.cpp source
        if: matrix.shard == 'true'
        run: rm -rf llama.cpp

      - name: Generate Dockerfile (append COPYs for ik_llama sharded entries)
        if: matrix.shard == 'true'
        env:
          HF_FILENAME: ${{ matrix.hf_filename }}
          DOCKERFILE_TEMPLATE: ${{ matrix.dockerfile_template }}
        run: |
          base="${HF_FILENAME%.gguf}"
          {
            cat "$DOCKERFILE_TEMPLATE"
            echo ""
            echo "# --- Auto-generated COPY lines (one image layer per shard) ---"
            for f in "$base-"*.gguf; do
              echo "COPY $f /models/$(basename "$f")"
            done
          } > Dockerfile
          echo "=== Generated Dockerfile ==="
          cat Dockerfile

      - name: Use template as-is (non-sharded entries)
        if: matrix.shard != 'true'
        env:
          DOCKERFILE_TEMPLATE: ${{ matrix.dockerfile_template }}
        run: |
          cp "$DOCKERFILE_TEMPLATE" Dockerfile
          echo "=== Dockerfile (template only) ==="
          cat Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image_name }}
          tags: |
            type=sha,format=short,prefix=
            type=raw,value=${{ matrix.image_tag }},enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            MODEL_CONFIG=${{ matrix.config_path }}
          provenance: false

      - name: Smoke test (run + hit endpoints)
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image_name }}:${{ steps.meta.outputs.version }}
          NAME: ${{ matrix.image_name }}
          HEALTH_PATH: ${{ matrix.smoke_health_path }}
          MODELS_PATH: ${{ matrix.smoke_models_path }}
          HEAVY_PATH: ${{ matrix.smoke_heavy_path }}
          HEAVY_BODY: ${{ matrix.smoke_heavy_body }}
          HEAVY_TIMEOUT: ${{ matrix.smoke_heavy_timeout }}
        run: ./scripts/smoke-test.sh

