name: build-images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Dockerfile.ik-llama.in'
      - 'Dockerfile.vllm.in'
      - 'models/**'
      - '.github/workflows/build.yml'

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: ${{ matrix.image_name }}:${{ matrix.image_tag }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - model_id: ornith-1.0-35b
            engine: ik-llama
            config_path: models/ornith-1.0-35b/config.yaml
            dockerfile_template: Dockerfile.ik-llama.in
            hf_repo: deepreinforce-ai/Ornith-1.0-35B-GGUF
            hf_filename: ornith-1.0-35b-Q4_K_M.gguf
            download_mode: single
            shard: 'true'
            image_name: ik-llama-ornith
            image_tag: q4km
          - model_id: qwen3.5-9b
            engine: vllm
            dockerfile_template: Dockerfile.vllm.in
            hf_repo: Qwen/Qwen3.5-9B
            download_mode: snapshot
            snapshot_dir: qwen3.5-9b-snapshot
            shard: 'false'
            image_name: vllm-qwen3.5-9b
            image_tag: bf16
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          echo "Before:"
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/lib/android 2>/dev/null || true
          sudo apt-get clean 2>/dev/null || true
          docker image prune --all --force 2>/dev/null || true
          echo "After:"
          df -h /

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install huggingface_hub
        run: pip install --quiet huggingface_hub

      - name: Download model (${{ matrix.download_mode }})
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO: ${{ matrix.hf_repo }}
          HF_FILENAME: ${{ matrix.hf_filename }}
          DOWNLOAD_MODE: ${{ matrix.download_mode }}
          SNAPSHOT_DIR: ${{ matrix.snapshot_dir }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import hf_hub_download, snapshot_download

          mode = os.environ["DOWNLOAD_MODE"]
          repo = os.environ["HF_REPO"]
          token = os.environ.get("HF_TOKEN") or None

          if mode == "single":
              path = hf_hub_download(
                  repo_id=repo,
                  filename=os.environ["HF_FILENAME"],
                  repo_type="model",
                  local_dir=".",
                  token=token,
              )
              print("Downloaded:", path)
          elif mode == "snapshot":
              path = snapshot_download(
                  repo_id=repo,
                  local_dir=os.environ["SNAPSHOT_DIR"],
                  token=token,
              )
              print("Downloaded snapshot to:", path)
          else:
              raise SystemExit(f"unknown download mode: {mode}")
          PY

      - name: Build llama-gguf-split
        if: matrix.shard == 'true'
        run: |
          git clone --depth 1 https://github.com/ggerganov/llama.cpp.git
          cmake -S llama.cpp -B llama.cpp/build -DCMAKE_BUILD_TYPE=Release
          cmake --build llama.cpp/build --target llama-gguf-split -j"$(nproc)"
          ls -lh llama.cpp/build/bin/llama-gguf-split

      - name: Shard GGUF (~5 GB per shard)
        if: matrix.shard == 'true'
        env:
          HF_FILENAME: ${{ matrix.hf_filename }}
        run: |
          base="${HF_FILENAME%.gguf}"
          ./llama.cpp/build/bin/llama-gguf-split \
            --split-max-size 5G \
            "$HF_FILENAME" \
            "$base"
          rm "$HF_FILENAME"
          echo "--- shards ---"
          ls -lh "$base-"*.gguf

      - name: Cleanup llama.cpp source (no longer needed)
        if: matrix.shard == 'true'
        run: rm -rf llama.cpp

      - name: Generate Dockerfile (one COPY per file/layer)
        env:
          HF_FILENAME: ${{ matrix.hf_filename }}
          SNAPSHOT_DIR: ${{ matrix.snapshot_dir }}
          DOCKERFILE_TEMPLATE: ${{ matrix.dockerfile_template }}
          SHARD: ${{ matrix.shard }}
        run: |
          {
            cat "$DOCKERFILE_TEMPLATE"
            echo ""
            echo "# --- Auto-generated COPY lines (one image layer per file) ---"
            if [ "$SHARD" = "true" ]; then
              # ik_llama: sharded GGUF -> /models/<shard>
              base="${HF_FILENAME%.gguf}"
              for f in "$base-"*.gguf; do
                echo "COPY $f /models/$(basename "$f")"
              done
            else
              # vLLM: snapshot -> /models/qwen3.5-9b/<file>
              # Sorted largest-first so config/tokenizer edits don't invalidate the
              # heavy safetensors layer cache.
              # Portable stat: try GNU first (-c%s), fall back to BSD (-f%z).
              ls -1 "$SNAPSHOT_DIR" \
                | while read -r f; do
                    size=$(stat -c%s "$SNAPSHOT_DIR/$f" 2>/dev/null || stat -f%z "$SNAPSHOT_DIR/$f")
                    printf '%s\t%s\n' "$size" "$SNAPSHOT_DIR/$f"
                  done \
                | sort -rn \
                | while IFS=$'\t' read -r size path; do
                    echo "COPY $path /models/qwen3.5-9b/$(basename "$path")"
                  done
            fi
          } > Dockerfile
          echo "=== Generated Dockerfile ==="
          cat Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image_name }}
          tags: |
            type=sha,format=short,prefix=
            type=raw,value=${{ matrix.image_tag }},enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            MODEL_CONFIG=${{ matrix.config_path }}
          provenance: false