name: build-images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Dockerfile.ik-llama.in'
      - 'wrapper.sh'
      - 'go-4/**'
      - 'models/**'
      - '.github/workflows/build.yml'

# One in-flight run per branch. Each push starts three jobs, two of which
# compile ik_llama.cpp for three ISAs (~40 min each), so a superseded run
# left to finish is a lot of wasted runner time. Cancel it the moment a
# newer commit lands on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: ${{ matrix.image_name }}:${{ matrix.image_tag }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_name: eve
            dockerfile_template: Dockerfile.ik-llama.in
            config_path: models/ornith-1.5-35b-a3b/config.yaml
            download_mode: single
            hf_repo: ornith-ai/Ornith-1.5-35B-A3B-GGUF
            # Q5_K_M (25.35 GB). Q6_K (29.21 GB) was tried and WEDGED the
            # runner: buildkit filled the disk and the job hung until it was
            # cancelled at ~90 min, having pushed nothing.
            #
            # The real budget, measured rather than assumed: the runner is
            # 145 GB with ~110 GB free after the cleanup step, and a 29 GB
            # GGUF consumes ALL of it -- wall-e's Q8_0 (29.05 GB) finished
            # its build with 54 MB left, at 100% full. Peak is ~3.8x the
            # GGUF, not the ~2x an earlier comment here claimed: shards on
            # disk + buildkit's uncompressed layer store + the compressed
            # push blobs (GGUF barely compresses) + three ISA build caches.
            # So the ceiling is ~29 GB and Q6_K sits ON it, not inside it;
            # 160 MB more than wall-e was enough to go over.
            #
            # Q5_K_M leaves ~15 GB of real margin and is the same footprint
            # class as the 1.0 builds that succeeded repeatedly. Cost is low
            # here anyway: 1.5 is a 256-expert MoE activating 8 (~3B of ~35B),
            # so per-token bandwidth is a fraction of the file either way.
            hf_filename: Ornith-1.5-35B-Q5_K_M.gguf
            shard: 'true'
            image_tag: latest
            smoke_health_path: /health
            smoke_models_path: /v1/models
            smoke_heavy_path: /v1/chat/completions
            smoke_heavy_body: '{"model":"eve","messages":[{"role":"user","content":"hi"}],"max_tokens":2}'
            smoke_heavy_timeout: 180
            smoke_ctx: '4096'
            # ~25 GB of Ornith-1.5 shards. Exporting a third copy into the
            # Docker daemon (build context + buildkit layers + daemon) fills
            # even a 145 GB runner: "No space left on device". Pull it back
            # after the build instead, once the cache and shards are freed.
            build_load: 'false'
          - image_name: wall-e
            dockerfile_template: Dockerfile.ik-llama.in
            config_path: models/kat-coder-v2.5-dev/config.yaml
            download_mode: single
            hf_repo: Myric/KAT-Coder-V2.5-Dev-MTP-APEX-GGUF
            # Replaces the DENSE Qwen3.8-27B, which measured 1.4 tok/s on the
            # production E48as_v5 against eve's 20-30. That gap is structural,
            # not tuning: dense re-reads all ~24 GB of weights per token where
            # eve (MoE, 3B active of 35B) reads ~2.2 GB. CPU decoding is
            # memory-bandwidth bound, so it is ~11x of handicap and no thread,
            # NUMA or mlock setting touches it.
            #
            # KAT-Coder is the same qwen35moe skeleton as eve, confirmed from
            # the GGUF header: 753 tensors, block_count 41, 256 experts /
            # 8 used, embedding_length 2048. At 20.67 GB it reads ~1.8 GB per
            # token -- LESS than eve -- and bundles the MTP layer
            # (nextn_predict_layers=1) that --spec-type mtp turns on.
            #
            # Side effect: the smoke test should start passing again. It only
            # ever failed here because a dense 27B cannot generate a token on
            # a 15.6 GiB runner; eve passes at a comparable file size because
            # MoE touches a fraction of the weights per token.
            hf_filename: KAT-Coder-V2.5-Dev-MTP-APEX-i-quality-v2.gguf
            shard: 'true'
            image_tag: latest
            smoke_health_path: /health
            smoke_models_path: /v1/models
            smoke_heavy_path: /v1/chat/completions
            smoke_heavy_body: '{"model":"wall-e","messages":[{"role":"user","content":"hi"}],"max_tokens":2}'
            smoke_heavy_timeout: 180
            smoke_ctx: '4096'
            # 20.67 GB x ~3.8 peak = ~79 GB against ~110 GB free. A third
            # copy in the daemon would be ~110 GB with no margin, so keep the
            # build-then-pull path both ik_llama images now use.
            build_load: 'false'
          - image_name: go-4
            dockerfile_template: go-4/Dockerfile.go-4.in
            download_mode: snapshot
            hf_repos: |
              nomic-ai/nomic-embed-text-v1.5
              nomic-ai/nomic-embed-vision-v1.5
              nomic-ai/nomic-bert-2048
            hf_snapshot_dirs: |
              go-4-snapshot-text
              go-4-snapshot-vision
              go-4-snapshot-code
            hf_snapshot_patterns: |
              *
              *
              *.py
            shard: 'false'
            image_tag: latest
            smoke_health_path: /health
            smoke_models_path: /v1/models
            smoke_heavy_path: /v1/embeddings
            smoke_heavy_body: '{"model":"nomic-embed-vision-v1.5","input":"smoke test"}'
            smoke_heavy_timeout: 90
            build_load: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          echo "Before:"
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/lib/android 2>/dev/null || true
          sudo apt-get clean 2>/dev/null || true
          docker image prune --all --force 2>/dev/null || true
          echo "After:"
          df -h /

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install huggingface_hub
        run: pip install --quiet huggingface_hub

      - name: Download model (${{ matrix.download_mode }})
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO: ${{ matrix.hf_repo }}
          HF_FILENAME: ${{ matrix.hf_filename }}
          DOWNLOAD_MODE: ${{ matrix.download_mode }}
          HF_REPOS: ${{ matrix.hf_repos }}
          HF_SNAPSHOT_DIRS: ${{ matrix.hf_snapshot_dirs }}
          HF_SNAPSHOT_PATTERNS: ${{ matrix.hf_snapshot_patterns }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import hf_hub_download, snapshot_download

          mode = os.environ["DOWNLOAD_MODE"]
          token = os.environ.get("HF_TOKEN") or None

          if mode == "single":
              path = hf_hub_download(
                  repo_id=os.environ["HF_REPO"],
                  filename=os.environ["HF_FILENAME"],
                  repo_type="model",
                  local_dir=".",
                  token=token,
              )
              print("Downloaded:", path)
          elif mode == "snapshot":
              repos = [r.strip() for r in os.environ.get("HF_REPOS", "").splitlines() if r.strip()]
              dirs  = [d.strip() for d in os.environ.get("HF_SNAPSHOT_DIRS", "").splitlines() if d.strip()]
              if len(repos) != len(dirs):
                  raise SystemExit(f"HF_REPOS and HF_SNAPSHOT_DIRS length mismatch: {len(repos)} vs {len(dirs)}")

              # Optional per-repo allow-patterns, one line per repo, comma
              # separated. "*" (or an absent list) means the whole repo. This
              # exists so the nomic-bert-2048 code repo can contribute just its
              # two .py files instead of ~1 GB of weights we never load.
              raw_patterns = [p.strip() for p in os.environ.get("HF_SNAPSHOT_PATTERNS", "").splitlines() if p.strip()]
              if raw_patterns and len(raw_patterns) != len(repos):
                  raise SystemExit(f"HF_SNAPSHOT_PATTERNS length mismatch: {len(raw_patterns)} vs {len(repos)}")
              if not raw_patterns:
                  raw_patterns = ["*"] * len(repos)

              for repo, dest, pattern in zip(repos, dirs, raw_patterns):
                  allow = None if pattern == "*" else [p.strip() for p in pattern.split(",")]
                  path = snapshot_download(repo_id=repo, local_dir=dest, token=token, allow_patterns=allow)
                  print(f"Downloaded {repo} ({pattern}) to:", path)
          else:
              raise SystemExit(f"unknown download mode: {mode}")
          PY

      - name: Build llama-gguf-split
        if: matrix.shard == 'true'
        run: |
          git clone --depth 1 https://github.com/ggerganov/llama.cpp.git
          cmake -S llama.cpp -B llama.cpp/build -DCMAKE_BUILD_TYPE=Release
          cmake --build llama.cpp/build --target llama-gguf-split -j"$(nproc)"
          ls -lh llama.cpp/build/bin/llama-gguf-split

      - name: Shard GGUF (~5 GB per shard)
        if: matrix.shard == 'true'
        env:
          HF_FILENAME: ${{ matrix.hf_filename }}
        run: |
          base="${HF_FILENAME%.gguf}"
          ./llama.cpp/build/bin/llama-gguf-split \
            --split-max-size 5G \
            "$HF_FILENAME" \
            "$base"
          rm "$HF_FILENAME"
          echo "--- shards ---"
          ls -lh "$base-"*.gguf

      - name: Cleanup llama.cpp source
        if: matrix.shard == 'true'
        run: rm -rf llama.cpp

      # The config has to name the FIRST shard, whose filename embeds the
      # total count (-00001-of-00005). That count depends on the model's size
      # against --split-max-size, so hardcoding it in config.yaml is a guess
      # that only fails after a ~40 minute build. Rewrite it from the shards
      # that actually exist instead.
      - name: Point the config at the first shard actually produced
        if: matrix.shard == 'true'
        env:
          HF_FILENAME: ${{ matrix.hf_filename }}
          CONFIG_PATH: ${{ matrix.config_path }}
        run: |
          set -euo pipefail
          base="${HF_FILENAME%.gguf}"
          first=$(ls "$base"-*-of-*.gguf 2>/dev/null | sort | head -1)
          if [ -z "$first" ]; then
            echo "FAIL: sharding produced no $base-*-of-*.gguf files"; ls -la ./*.gguf || true; exit 1
          fi
          echo "First shard: $first"
          before=$(grep -c -- "--model /models/" "$CONFIG_PATH" || true)
          if [ "$before" != "1" ]; then
            echo "FAIL: expected exactly one --model line in $CONFIG_PATH, found $before"; exit 1
          fi
          sed -i -E "s|--model /models/[^[:space:]]+\.gguf|--model /models/$first|" "$CONFIG_PATH"
          echo "--- effective model line ---"
          grep -- "--model /models/" "$CONFIG_PATH"

      - name: Generate Dockerfile (append COPYs for ik_llama sharded entries)
        if: matrix.shard == 'true'
        env:
          HF_FILENAME: ${{ matrix.hf_filename }}
          DOCKERFILE_TEMPLATE: ${{ matrix.dockerfile_template }}
        run: |
          base="${HF_FILENAME%.gguf}"
          {
            cat "$DOCKERFILE_TEMPLATE"
            echo ""
            echo "# --- Auto-generated COPY lines (one image layer per shard) ---"
            for f in "$base-"*.gguf; do
              echo "COPY $f /models/$(basename "$f")"
            done
          } > Dockerfile
          echo "=== Generated Dockerfile ==="
          cat Dockerfile

      - name: Use template as-is (non-sharded entries)
        if: matrix.shard != 'true'
        env:
          DOCKERFILE_TEMPLATE: ${{ matrix.dockerfile_template }}
        run: |
          cp "$DOCKERFILE_TEMPLATE" Dockerfile
          echo "=== Dockerfile (template only) ==="
          cat Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image_name }}
          tags: |
            type=sha,format=short,prefix=
            type=raw,value=${{ matrix.image_tag }},enable={{is_default_branch}}

      - name: Disk before build
        run: df -h / | tail -1

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          load: ${{ matrix.build_load }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            MODEL_CONFIG=${{ matrix.config_path }}
          provenance: false

      # `load: true` exports the finished image into the Docker daemon so the
      # smoke test can run it without re-pulling from GHCR. That leaves TWO
      # copies on disk: buildkit's cache and the daemon's. For eve (~21 GB of
      # Ornith-35B shards, vs ~7 GB for wall-e) that is enough to fill the
      # runner — the job died mid-build at 39 min with its log blob missing,
      # the signature of a runner killed rather than a step erroring out.
      # The image is pushed and loaded by now, so buildkit's cache is dead
      # weight. Drop it before starting the container.
      - name: Reclaim disk before smoke test
        run: |
          echo "before prune:"; df -h / | tail -1
          docker buildx prune --all --force >/dev/null 2>&1 || true
          rm -f ./*.gguf || true
          echo "after prune:";  df -h / | tail -1

      - name: Smoke test (run + hit endpoints)
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image_name }}:${{ steps.meta.outputs.version }}
          NAME: ${{ matrix.image_name }}
          HEALTH_PATH: ${{ matrix.smoke_health_path }}
          MODELS_PATH: ${{ matrix.smoke_models_path }}
          HEAVY_PATH: ${{ matrix.smoke_heavy_path }}
          HEAVY_BODY: ${{ matrix.smoke_heavy_body }}
          HEAVY_TIMEOUT: ${{ matrix.smoke_heavy_timeout }}
          SMOKE_CTX: ${{ matrix.smoke_ctx }}
          UPSTREAM_LOGS: '1'
        run: ./scripts/smoke-test.sh

