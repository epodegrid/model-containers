healthCheckTimeout: 1800
logLevel: info
# Send BOTH the proxy's request log and the upstream model's
# stdout/stderr to the container's stdout. llama-swap defaults to
# "proxy", which DISCARDS upstream output -- so `kubectl logs`
# showed only [INFO] Request lines, never llama-server's own output
# or the wrapper's `[llama-server-wrapper] CPU detected (zenN)`
# dispatch line. That is what made model crashes surface as a bare
# "exit status N" with no reason attached.
logToStdout: both
metricsMaxInMemory: 1000
sendLoadingState: true
includeAliasesInList: true

models:
  # The model id is the IMAGE name, so callers address the container they
  # deployed rather than whatever weights happen to be inside it. The real
  # model name stays available as an alias.
  "wall-e":
    proxy: "http://127.0.0.1:9999"
    cmd: >
      /app/llama-server
      --model /models/Qwen3.8-27B-Q8_0-00001-of-00006.gguf
      --alias wall-e
      --port 9999
      --parallel 1
      --webui llamacpp
      --jinja
      --ctx-size 262144
      -fa on
      -ctk q8_0 -ctv q8_0
      --reasoning on
      --reasoning-format deepseek
      --temp 1.0 --top-p 0.95 --top-k 20 --min-p 0 --presence-penalty 0 --repeat-penalty 1
    aliases:
      - "wall-e"
      - "qwen"
      - "Qwen3.8-27B"
      - "Qwen/Qwen3.8-27B"
    filters:
      setParamsByID:
        # Agentic/coding work. The card evaluates SWE-bench Pro, DeepSWE 1.1
        # and QwenSWEBench at temp=1.0, top_p=0.95 -- which is ALSO the
        # card's recommended thinking-mode sampler, so this preset only
        # pins what the bare id already defaults to.
        "${MODEL_ID}:thinking-coding":
          temperature: 1.0
          top_p: 0.95
        # Non-thinking. Unlike Ornith, the Qwen3.8 card gives an explicit
        # instruct-mode sampler -- and it asks for presence_penalty=1.5,
        # not 0. That is a real difference from thinking mode (which wants
        # 0), so it has to be set here rather than inherited from the cmd.
        "${MODEL_ID}:instruct":
          temperature: 0.7
          top_p: 0.8
          presence_penalty: 1.5
          chat_template_kwargs:
            enable_thinking: false
        # Qwen3.8 adds reasoning_effort (xhigh default / medium / low) on
        # top of the on/off switch. Exposed as presets so callers can trade
        # reasoning depth for latency without touching the sampler -- on a
        # bandwidth-bound CPU path, output length dominates latency.
        "${MODEL_ID}:thinking-medium":
          chat_template_kwargs:
            reasoning_effort: medium
        "${MODEL_ID}:thinking-low":
          chat_template_kwargs:
            reasoning_effort: low
