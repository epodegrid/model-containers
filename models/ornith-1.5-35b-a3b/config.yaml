healthCheckTimeout: 1800
logLevel: info
# Send BOTH the proxy's request log and the upstream model's
# stdout/stderr to the container's stdout. llama-swap defaults to
# "proxy", which DISCARDS upstream output -- so `kubectl logs`
# showed only [INFO] Request lines, never llama-server's own output
# or the wrapper's `[llama-server-wrapper] CPU detected (zenN)`
# dispatch line. That is what made model crashes surface as a bare
# "exit status N" with no reason attached.
logToStdout: both
metricsMaxInMemory: 1000
sendLoadingState: true
includeAliasesInList: true

models:
  # The model id is the IMAGE name, so callers address the container they
  # deployed rather than whatever weights happen to be inside it. "ornith"
  # stays as an alias, so anything already calling it keeps working.
  # MTP (multi-token prediction) self-speculative decoding is ON.
  #
  # The weights already carried it: this GGUF reports block_count=41 (40
  # layers + 1 MTP layer) and nextn_predict_layers=1. ik_llama was loading
  # it and throwing it away -- the "unused tensor blk.40.nextn.* -- ignoring"
  # line in the container log -- because model params default mtp=false.
  # --spec-type mtp flips it on; no new weights, no separate draft model.
  #
  # The win is disproportionate on CPU. Decoding is memory-bandwidth bound,
  # so verifying a 2-token batch reads the weights ONCE, the same as
  # generating 1 token -- the extra arithmetic is free. Speculative decoding
  # is also lossless: drafts are verified against the full model and
  # rejected ones discarded, so output is unchanged. Expect 1.4-2.2x
  # depending on acceptance rate, which is highest on the long <think>
  # traces these reasoning models spend most of their output on.
  "eve":
    proxy: "http://127.0.0.1:9999"
    cmd: >
      /app/llama-server
      --model /models/Ornith-1.5-35B-Q5_K_M-00001-of-00006.gguf
      --alias eve
      --port 9999
      --parallel 1
      --webui llamacpp
      --jinja
      --ctx-size 262144
      -fa on
      -ctk q8_0 -ctv q8_0
      --reasoning on
      --reasoning-format deepseek
      --spec-type mtp
      --temp 0.6 --top-p 0.95 --top-k 20 --min-p 0 --presence-penalty 0 --repeat-penalty 1
    aliases:
      - "eve"
      - "ornith"
      - "Ornith-1.5-35B-A3B"
      - "ornith-ai/Ornith-1.5-35B-A3B"
    filters:
      setParamsByID:
        # Agentic/coding work. The card reports SWE-Bench Verified/Pro/
        # Multilingual, DeepSWE and SWE Atlas at temperature=1.0,
        # top_p=0.95 -- higher than the general recommendation, and these
        # are the numbers the published coding scores were produced with.
        "${MODEL_ID}:thinking-coding":
          temperature: 1.0
          top_p: 0.95
        # Non-thinking. The card gives no sampling for this mode (Ornith is
        # a reasoning model first), so these follow the Qwen3.5 guidance for
        # the architecture it is built on: qwen3_5_moe.
        "${MODEL_ID}:instruct":
          temperature: 0.7
          top_p: 0.8
          chat_template_kwargs:
            enable_thinking: false
