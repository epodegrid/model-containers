healthCheckTimeout: 1800
logLevel: info
# Send BOTH the proxy's request log and the upstream model's
# stdout/stderr to the container's stdout. llama-swap defaults to
# "proxy", which DISCARDS upstream output -- so `kubectl logs`
# showed only [INFO] Request lines, never llama-server's own output
# or the wrapper's `[llama-server-wrapper] CPU detected (zenN)`
# dispatch line. That is what made model crashes surface as a bare
# "exit status N" with no reason attached.
logToStdout: both
metricsMaxInMemory: 1000
sendLoadingState: true
includeAliasesInList: true

models:
  # The model id is the IMAGE name, so callers address the container they
  # deployed rather than whatever weights happen to be inside it. The real
  # model name stays available as an alias.
  #
  # This slot was a DENSE 27B (Qwen3.8) and measured 1.4 tok/s on the
  # E48as_v5. Dense is the whole reason: it re-read all ~24 GB of weights
  # per token, against eve's ~2.2 GB (MoE, 3B active of 35B). On a
  # bandwidth-bound CPU that is an ~11x handicap no amount of tuning
  # closes. KAT-Coder is the same qwen35moe skeleton as eve -- 256
  # experts, 8 active, 40 layers + 1 MTP -- so it reads ~1.8 GB/token
  # and should land at eve-class throughput or better.
  #
  # MTP self-speculative decoding is on; see eve's config for why that is
  # worth more on CPU than it looks. This GGUF bundles the layer
  # (block_count=41, nextn_predict_layers=1).
  "wall-e":
    proxy: "http://127.0.0.1:9999"
    cmd: >
      /app/llama-server
      --model /models/KAT-Coder-V2.5-Dev-MTP-APEX-i-quality-v2-00001-of-00005.gguf
      --alias wall-e
      --port 9999
      --parallel 1
      --webui llamacpp
      --jinja
      --ctx-size 262144
      -fa on
      -ctk q8_0 -ctv q8_0
      --reasoning on
      --reasoning-format deepseek
      --spec-type mtp
      --temp 0.6 --top-p 0.95 --top-k 20 --min-p 0 --presence-penalty 0 --repeat-penalty 1
    aliases:
      - "wall-e"
      - "kat"
      - "kat-coder"
      - "KAT-Coder-V2.5-Dev"
      - "Kwaipilot/KAT-Coder-V2.5-Dev"
    filters:
      setParamsByID:
        # Agentic/coding work -- what this model is actually tuned for.
        # Same qwen3_5 sampler shape the coding numbers are reported with.
        "${MODEL_ID}:thinking-coding":
          temperature: 1.0
          top_p: 0.95
        # Non-thinking. The template exposes enable_thinking, same as eve.
        "${MODEL_ID}:instruct":
          temperature: 0.7
          top_p: 0.8
          chat_template_kwargs:
            enable_thinking: false
