healthCheckTimeout: 1800
logLevel: info
# Send BOTH the proxy's request log and the upstream model's
# stdout/stderr to the container's stdout. llama-swap defaults to
# "proxy", which DISCARDS upstream output -- so `kubectl logs`
# showed only [INFO] Request lines, never llama-server's own output
# or the wrapper's `[llama-server-wrapper] CPU detected (zenN)`
# dispatch line. That is what made model crashes surface as a bare
# "exit status N" with no reason attached.
logToStdout: both
metricsMaxInMemory: 1000
sendLoadingState: true
includeAliasesInList: true

models:
  # The model id is the IMAGE name, so callers address the container they
  # deployed rather than whatever weights happen to be inside it. The real
  # model name stays available as an alias.
  "wall-e":
    proxy: "http://127.0.0.1:9999"
    cmd: >
      /app/llama-server
      --model /models/ornith-1.0-9b-Q8_0-00001-of-00002.gguf
      --alias wall-e
      --port 9999
      --parallel 1
      --webui llamacpp
      --jinja
      --ctx-size 262144
      -fa on
      --reasoning on
      --reasoning-format deepseek
      --temp 0.6 --top-p 0.95 --top-k 20 --min-p 0 --presence-penalty 0 --repeat-penalty 1
    aliases:
      - "wall-e"
      - "ornith-9b"
      - "Ornith-1.0-9B"
      - "ornith-ai/Ornith-1.0-9B"
    filters:
      setParamsByID:
        # Agentic/coding work. The model card reports SWE-Bench Verified/Pro
        # and SWE Atlas at temperature=1.0, top_p=0.95 -- higher than the
        # general recommendation, and these are the numbers the published
        # coding scores were actually produced with.
        "${MODEL_ID}:thinking-coding":
          temperature: 1.0
          top_p: 0.95
        # Non-thinking. The card gives no sampling for this mode (it is a
        # reasoning model first), so these follow the Qwen3 guidance for the
        # architecture Ornith is built on: qwen3_5.
        "${MODEL_ID}:instruct":
          temperature: 0.7
          top_p: 0.8
          chat_template_kwargs:
            enable_thinking: false
