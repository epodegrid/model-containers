healthCheckTimeout: 1800
logLevel: info
# Send BOTH the proxy's request log and the upstream model's
# stdout/stderr to the container's stdout. llama-swap defaults to
# "proxy", which DISCARDS upstream output -- so `kubectl logs`
# showed only [INFO] Request lines, never llama-server's own output
# or the wrapper's `[llama-server-wrapper] CPU detected (zenN)`
# dispatch line. That is what made model crashes surface as a bare
# "exit status N" with no reason attached.
logToStdout: both
metricsMaxInMemory: 1000
sendLoadingState: true
includeAliasesInList: true

models:
  "ornith":
    proxy: "http://127.0.0.1:9999"
    cmd: >
      /app/llama-server
      --model /models/ornith-1.0-35b-Q4_K_M-00001-of-00005.gguf
      --alias ornith
      --port 9999
      --parallel 1
      --webui llamacpp
      --jinja
      --ctx-size 262144
      -fa on
      --temp 0.6 --top-p 0.95 --top-k 20 --min-p 0 --presence-penalty 1.5 --repeat-penalty 1
    aliases:
      - "ornith"
      - "Ornith-1.0-35B"
      - "deepreinforce-ai/Ornith-1.0-35B"
    filters:
      setParamsByID:
        "${MODEL_ID}:thinking-coding":
          temperature: 0.6
          presence_penalty: 0.0
        "${MODEL_ID}:instruct":
          temperature: 0.7
          top_p: 0.8
          chat_template_kwargs:
            enable_thinking: false